appId: com.innovatia.analyticsbuilder
productName: InnovatIA Analytics Builder
copyright: © 2026 InnovatIA Ltd

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  # Bundle the optional Oracle driver when it installed. Used in "thin" mode
  # (pure JavaScript — no Oracle client), so no native rebuild is required.
  - node_modules/oracledb/**/*

asar: true
# oracledb ships a native addon (only used for thick mode, which we never
# invoke); keep it outside asar so the package loads cleanly, and don't
# rebuild native modules against Electron — thin mode needs no binary.
asarUnpack:
  - node_modules/oracledb/**/*
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # The canonical build runs on a Windows agent (see .github/workflows/
  # build-installer.yml), where exe resource stamping works natively. When
  # building from Linux without wine, pass -c.win.signAndEditExecutable=false.
  # Code signing: configure WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (or
  # azureSignOptions) on the build agent — never store certificates in-repo.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: InnovatIA-Analytics-Builder-Setup-${version}.${ext}
  shortcutName: InnovatIA Analytics Builder
  uninstallDisplayName: InnovatIA Analytics Builder
  createDesktopShortcut: always
  createStartMenuShortcut: true
  license: build/license.txt

linux:
  target:
    - AppImage
  category: Office
